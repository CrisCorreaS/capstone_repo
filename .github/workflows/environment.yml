name: Environment check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  environment:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          run-install: false
          cache: false

      - name: Install locked environment
        run: |
          pixi install --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify CGM data
        env:
          CGM_DATA_PATH: ${{ runner.temp }}/cgm-data
        run: |
          pixi run --locked download-data --destination "$env:CGM_DATA_PATH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run --locked download-data --destination "$env:CGM_DATA_PATH" --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Python and Jupyter versions
        run: |
          pixi run --locked python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run --locked jupyter --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check scientific-package imports
        run: |
          pixi run --locked python -B -c "import pandas, numpy, matplotlib.pyplot, sklearn, seaborn; print('Scientific package imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check downloaded raw data totals
        env:
          CGM_DATA_PATH: ${{ runner.temp }}/cgm-data
        run: |
          @'
          import os
          from src.data_utils import load_dataset

          _, participants = load_dataset(data_path=os.environ["CGM_DATA_PATH"])
          participant_count = len(participants)
          record_count = sum(len(records) for records in participants.values())
          print(f"Participants: {participant_count}; raw CGM records: {record_count:,}")
          assert participant_count == 208, f"Expected 208 participants, got {participant_count}"
          assert record_count == 114_912, f"Expected 114,912 raw CGM records, got {record_count:,}"
          '@ | pixi run --locked python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
