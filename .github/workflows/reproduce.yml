name: Reproduce

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-64
            runner: windows-2025
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: osx-64
            runner: macos-15-intel
          - platform: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fresh clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          run-install: false
          cache: false

      - name: Install locked environment
        run: |
          $lockHash = (Get-FileHash pixi.lock -Algorithm SHA256).Hash
          pixi install --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash pixi.lock -Algorithm SHA256).Hash -ne $lockHash) {
            throw 'Locked installation changed pixi.lock'
          }

      - name: Confirm native platform
        run: |
          pixi run --locked python -I -B -c "import platform, sys; actual = {'win32': 'win', 'linux': 'linux', 'darwin': 'osx'}[sys.platform] + ('-arm64' if platform.machine().lower() in ('arm64', 'aarch64') else '-64'); print(actual); assert actual == '${{ matrix.platform }}', actual"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check launcher and synthetic Jupyter render
        run: |
          pixi run --locked python -I -B tests/test_quarto.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reproduce analysis and report
        run: |
          pixi run --locked reproduce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check raw data totals and generated CSVs
        run: |
          pixi run --locked check-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Committed files must not change when the analysis runs
        if: always()
        run: |
          git status --porcelain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the Quarto report for seven days
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cgm-report-${{ matrix.platform }}
          path: reports/cgm-report.html
          if-no-files-found: error
          retention-days: 7

      - name: Keep result tables for seven days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-tables-${{ matrix.platform }}
          path: results/tables/*.csv
          if-no-files-found: warn
          retention-days: 7
