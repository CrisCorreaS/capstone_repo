[workspace]
name = "diabetes-cgm-analysis"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
pandas = "3.1.*"
numpy = "2.5.*"
matplotlib = "3.11.*"
scikit-learn = "1.9.*"
seaborn = "0.13.*"
jupyter = "1.1.*"
nbclient = "==0.11.0"
nbformat = "==5.11.1"
jupyter_client = "==8.10.0"
ipykernel = "==7.4.0"

[tasks]
download-data = "python -B src/download_data.py"
reproduce = "python -I -B src/reproduce.py"
